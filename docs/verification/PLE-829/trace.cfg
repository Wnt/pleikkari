# PLE-829: the app's view and input slices (deliverInputEvent, PLE746 sections) with thread names,
# for key_threads.py. Written into the file as it runs, so stim.sh can stop it the moment the presses
# are done (perfetto --detach / --attach --stop).
buffers {
  size_kb: 65536
  fill_policy: RING_BUFFER
}
data_sources {
  config {
    name: "linux.ftrace"
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      atrace_categories: "view"
      atrace_categories: "input"
      atrace_apps: "fi.madekivi.pleikkari"
    }
  }
}
data_sources {
  config {
    name: "linux.process_stats"
    process_stats_config {
      scan_all_processes_on_start: true
    }
  }
}
duration_ms: 180000
write_into_file: true
file_write_period_ms: 1000
