plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

def rootCMakeLists = "../../CMakeLists.txt"
def rootCMakeListsContent = file(rootCMakeLists).text
static def grepVersionComponent(content, varname) {
    def match = content =~ /set\($varname ([0-9]+)\)/
    if(!match.find())
        throw new GradleException("Failed to find $varname in CMakeLists.txt")
    return match.group(1)
}
def chiakiVersionMajor = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_MAJOR")
def chiakiVersionMinor = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_MINOR")
def chiakiVersionPatch = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_PATCH")
def chiakiVersion = "$chiakiVersionMajor.$chiakiVersionMinor.$chiakiVersionPatch"
println("Determined Chiaki Version: $chiakiVersion")

// PLE-410: docs/verification/lib/check-apk-freshness.py needs to know exactly which
// commit this APK was compiled from, to answer "does this binary's source include the
// last change to the stats fields it measures" -- a git-ancestry question, not a
// timestamp comparison (dex entries are stamped with a fixed reproducible-build epoch,
// so their mtimes carry no build-time signal at all). The marker prefix makes the value
// trivially findable as a raw string in the compiled dex without parsing dex format.
//
// This must go through providers.exec(), not a plain .execute(): configuration cache is
// on for this project (android/.gradle/configuration-cache exists), and a bare
// `[...].execute()` here is invisible to it -- HEAD moves, the cache is judged still
// valid on every other input, and the embedded sha silently keeps the value from
// whichever build first populated the cache. providers.exec()'s output is a tracked
// configuration-cache input, so a HEAD change correctly invalidates it. Caught by
// actually rebuilding across a rebase during PLE-410 and finding the embedded sha had
// gone stale exactly the way this ticket exists to catch.
def gitShaProvider = providers.exec {
    workingDir rootProject.projectDir
    commandLine "git", "rev-parse", "HEAD"
    ignoreExitValue = true
}.standardOutput.asText
def gitSha = gitShaProvider.getOrElse("").trim()
if (!(gitSha ==~ /[0-9a-f]{40}/)) gitSha = "unknown"
def buildGitShaMarker = "PLE410_BUILD_GIT_SHA:$gitSha"

def takionReceiveBatching = (project.findProperty("chiakiTakionReceiveBatching") ?: "false").toBoolean()
def androidEglRenderer = (project.findProperty("chiakiAndroidEglRenderer") ?: "false").toBoolean()
// PLE-10: off by default; -PchiakiTakionSocketTuning=true builds the A/B "on" APK.
def takionSocketTuning = (project.findProperty("chiakiTakionSocketTuning") ?: "false").toBoolean()
// PLE-284: -PchiakiPsnMock=verified|nolink builds a debug APK that signs in against the PSN mock
// (android/psn-mock) instead of Sony. It is a separate app (fi.madekivi.pleikkari.psnmock), so it can
// never overwrite a real install's PSN credentials, and a release build refuses the property.
def psnMockHosts = [verified: "pleikkari-psn.lab.madekivi.fi", nolink: "pleikkari-psn-nolink.lab.madekivi.fi"]
def psnMockArg = (project.findProperty("chiakiPsnMock") ?: "").toString().trim()
if(psnMockArg && !psnMockHosts.containsKey(psnMockArg))
    throw new GradleException("chiakiPsnMock must be one of ${psnMockHosts.keySet()}, not '$psnMockArg'")
def psnMockHost = psnMockArg ? psnMockHosts[psnMockArg] : ""
def chiakiAbiFilters = (project.findProperty("chiakiAbiFilters") ?: "")
        .toString()
        .split(',')
        .collect { it.trim() }
        .findAll { it }

// PLE-602: optional, licensed Go SDK. A partial extraction must fail loudly.
def goVrSdk = file("../../third_party/ovr_sdk_mobile")
def goVrRequested = (project.findProperty("chiakiGoVr") ?: "auto").toString()
if(!(goVrRequested in ["auto", "true", "false"]))
    throw new GradleException("chiakiGoVr must be auto, true or false")
def goVrFiles = ["VrApi/Include/VrApi.h", "VrApi/Include/VrApi_Helpers.h",
                 "VrApi/Include/VrApi_Input.h", "VrApi/Libs/Android/arm64-v8a/Release/libvrapi.so"]
def goVrPresent = goVrFiles.every { new File(goVrSdk, it).isFile() }
def goVrEnabled = goVrRequested != "false" && goVrPresent
if(goVrRequested != "false" && !goVrPresent &&
        (goVrRequested == "true" || new File(goVrSdk, "VrApi").exists()))
    throw new GradleException("Incomplete Oculus Mobile SDK: see third_party/ovr_sdk_mobile/README.md")
if(goVrEnabled && psnMockHost)
    throw new GradleException("Go VR and PSN mock manifest overlays cannot be combined; use -PchiakiGoVr=false")
println("Go VrApi: ${goVrEnabled ? 'SDK enabled (arm64 only)' : 'not built'}")

// PLE-524: sanitizer builds, debug-only and off by default (android/native-stress/README.md).
// -PchiakiSanitizer=address|hwaddress instruments the APK's whole native build (chiaki-lib and
// chiaki-jni) and packages the NDK wrap.sh that loads the runtime at app start.
// -PchiakiNativeStress=thread|address|hwaddress builds the adb-shell stress tests next to an
// otherwise unchanged APK; TSan only works there, never inside an app process.
def sanitizerArg = (project.findProperty("chiakiSanitizer") ?: "").toString().trim()
if(sanitizerArg && !(sanitizerArg in ["address", "hwaddress"]))
    throw new GradleException("chiakiSanitizer must be address or hwaddress, not '$sanitizerArg'")
def nativeStressArg = (project.findProperty("chiakiNativeStress") ?: "").toString().trim()
if(nativeStressArg && !(nativeStressArg in ["thread", "address", "hwaddress"]))
    throw new GradleException("chiakiNativeStress must be thread, address or hwaddress, not '$nativeStressArg'")
if(sanitizerArg && nativeStressArg && sanitizerArg != nativeStressArg)
    throw new GradleException("chiakiSanitizer=$sanitizerArg and chiakiNativeStress=$nativeStressArg cannot share one native build")
def nativeStressAudioOutputSource = (project.findProperty("chiakiNativeStressAudioOutputSource") ?: "").toString().trim()
if(sanitizerArg == "hwaddress" || nativeStressArg == "hwaddress") {
    // The NDK has no HWASan runtime for any other Android ABI.
    if(!chiakiAbiFilters)
        chiakiAbiFilters = ["arm64-v8a"]
    else if(chiakiAbiFilters != ["arm64-v8a"])
        throw new GradleException("hwaddress needs -PchiakiAbiFilters=arm64-v8a, not $chiakiAbiFilters")
}
def sanitizerCmakeArgs = []
def sanitizerLinkerFlags = ""
if(sanitizerArg == "address") {
    def flags = "-fsanitize=address -fno-omit-frame-pointer"
    sanitizerCmakeArgs += ["-DCMAKE_C_FLAGS=$flags", "-DCMAKE_CXX_FLAGS=$flags", "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address"]
    sanitizerLinkerFlags = " -fsanitize=address"
} else if(sanitizerArg == "hwaddress") {
    sanitizerCmakeArgs += ["-DANDROID_SANITIZE=hwaddress"]
}
if(nativeStressArg) {
    sanitizerCmakeArgs += ["-DCHIAKI_ANDROID_NATIVE_STRESS=$nativeStressArg",
                           "-DCHIAKI_ANDROID_NATIVE_STRESS_OUTPUT_DIR=${layout.buildDirectory.dir("native-stress").get().asFile}"]
    if(nativeStressAudioOutputSource)
        sanitizerCmakeArgs += ["-DCHIAKI_ANDROID_NATIVE_STRESS_AUDIO_OUTPUT_SOURCE=${file(nativeStressAudioOutputSource)}"]
}
def debugOnlyProperties = []
if(psnMockHost)
    debugOnlyProperties += "chiakiPsnMock"
if(sanitizerArg)
    debugOnlyProperties += "chiakiSanitizer"
if(nativeStressArg)
    debugOnlyProperties += "chiakiNativeStress"
if(debugOnlyProperties) {
    gradle.taskGraph.whenReady { graph ->
        if(graph.allTasks.any { it.name.toLowerCase().contains("release") })
            throw new GradleException("${debugOnlyProperties.join(", ")} is debug-only; refusing to build a release variant with it")
    }
}

android {
    // PLE-573: the Kotlin package, R, BuildConfig and databinding moved from com.metallic.chiaki
    // with the sources; the JNI symbol names in src/main/cpp follow this package.
    namespace "fi.madekivi.pleikkari"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        // PLE-568: a new package, not a rename. The com.metallic.chiaki install keeps its data
        // (and the PS5 registration); `scripts/dev/app-state.sh migrate` copies it across.
        applicationId "fi.madekivi.pleikkari"
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName chiakiVersion
        ndk {
            abiFilters.addAll(chiakiAbiFilters)
        }
        buildConfigField "boolean", "GO_VR_BUILT", goVrEnabled.toString()
        buildConfigField "boolean", "CHIAKI_ANDROID_EGL_RENDERER", androidEglRenderer.toString()
        buildConfigField "String", "BUILD_GIT_SHA_MARKER", "\"$buildGitShaMarker\""
        externalNativeBuild {
            cmake {
                arguments "-DCHIAKI_ENABLE_TESTS=OFF",
                        "-DCHIAKI_GO_VR=${goVrEnabled ? 'ON' : 'OFF'}",
                        "-DCHIAKI_GO_VR_SDK=${goVrSdk.absolutePath}",
                        "-DCHIAKI_ENABLE_CLI=OFF",
                        "-DCHIAKI_ENABLE_GUI=OFF",
                        "-DCHIAKI_ENABLE_SETSU=OFF",
                        "-DCHIAKI_ENABLE_ANDROID=ON",
                        "-DCHIAKI_ENABLE_FFMPEG_DECODER=OFF",
                        "-DCHIAKI_ENABLE_PI_DECODER=OFF",
                        "-DCHIAKI_LIB_ENABLE_OPUS=OFF",
                        "-DCHIAKI_LIB_OPENSSL_EXTERNAL_PROJECT=ON",
                        "-DCHIAKI_LIB_JSONC_EXTERNAL_PROJECT=OFF",
                        "-DCHIAKI_LIB_MINIUPNPC_EXTERNAL_PROJECT=OFF",
                        "-DCHIAKI_ENABLE_STEAM_SHORTCUT=OFF",
                        "-DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF",
                        "-DCHIAKI_LIB_ENABLE_TAKION_RECEIVE_BATCHING=${takionReceiveBatching ? 'ON' : 'OFF'}",
                        "-DCHIAKI_ANDROID_EGL_RENDERER=${androidEglRenderer ? 'ON' : 'OFF'}",
                        "-DCHIAKI_LIB_ENABLE_TAKION_SOCKET_TUNING=${takionSocketTuning ? 'ON' : 'OFF'}",
                        "-DANDROID_STL=c++_shared",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384$sanitizerLinkerFlags"
                arguments.addAll(sanitizerCmakeArgs)
                // AGP only builds targets with an artifact; the collect step has none.
                if(nativeStressArg)
                    targets "chiaki-jni", "chiaki-audio-output-stress", "chiaki-native-stress-collect"
            }
        }
    }

    buildFeatures {
        viewBinding true
        prefab true
        buildConfig true
    }

    // PLE-523: Robolectric view tests (HomeScreenBoundsTest) inflate the real layouts and
    // resource qualifiers (layout-land, window size) inside testDebugUnitTest, so the gate
    // runs them without the shared emulator.
    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += "-opt-in=kotlin.ExperimentalUnsignedTypes"
    }

    if(goVrEnabled) {
        sourceSets.main.java.srcDir "src/vr/java"
        // A source set takes one manifest, so merge the VR activity into the debug overlay rather
        // than replacing it: the PLE-603 preview activity stays reachable in SDK-present builds.
        def applicationBody = { String path ->
            def text = file(path).text
            text.substring(text.indexOf(">", text.indexOf("<application")) + 1, text.indexOf("</application>"))
        }
        def debugVrManifest = layout.buildDirectory.file("generated/goVrDebugManifest/AndroidManifest.xml").get().asFile
        debugVrManifest.parentFile.mkdirs()
        debugVrManifest.text = """<?xml version="1.0" encoding="utf-8"?>
<!-- Generated by build.gradle from src/debug and src/vr; do not edit. -->
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application>${applicationBody("src/debug/AndroidManifest.xml")}${applicationBody("src/vr/AndroidManifest.xml")}</application>
</manifest>
"""
        sourceSets.debug.manifest.srcFile debugVrManifest
        sourceSets.release.manifest.srcFile "src/vr/AndroidManifest.xml"
    } else {
        // Compile the optional Kotlin in host unit tests even without the proprietary SDK.
        // No VR class or native library from this source set goes into an SDK-absent APK.
        sourceSets.test.java.srcDir "src/vr/java"
    }

    if(psnMockHost) {
        sourceSets.debug.manifest.srcFile "src/psnMock/AndroidManifest.xml"
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path rootCMakeLists
        }
    }

    signingConfigs {
        release
    }

    buildTypes {
        debug {
            buildConfigField "String", "PSN_MOCK_HOST", "\"$psnMockHost\""
            if(psnMockHost) {
                applicationIdSuffix ".psnmock"
                versionNameSuffix "-psnmock"
            }
            // Same applicationId (fi.madekivi.pleikkari, since PLE-568), so it installs over (and
            // streams with) the registered app; the suffix is what tells a sanitized install apart
            // in `dumpsys package`.
            if(sanitizerArg)
                versionNameSuffix = (versionNameSuffix ?: "") + "-$sanitizerArg"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    Properties properties = new Properties()
    def propertiesFile = file("../local.properties")
    if (propertiesFile.exists()) {
        properties.load(propertiesFile.newDataInputStream())
    }

    if(properties.containsKey("chiakiKeystore")) {
        println("Enabling Local Signing")
        buildTypes.release.signingConfig = signingConfigs.release
        buildTypes.debug.signingConfig = signingConfigs.release
        signingConfigs.release.storeFile = file(properties.get("chiakiKeystore"))
        signingConfigs.release.storePassword = properties.get("chiakiKeystorePW")
        signingConfigs.release.keyAlias = properties.get("chiakiKeyAlias")
        signingConfigs.release.keyPassword = properties.get("chiakiKeyPW")
    } else {
        println("Signing not enabled")
    }

    // PLE-97: CI signs the debug APK with the project's debug keystore so it
    // installs over the test phone's registered app (`adb install -r`). The
    // path comes in as a gradle property; local builds keep AGP's default
    // ~/.android/debug.keystore lookup.
    if(project.hasProperty("chiakiDebugKeystore")) {
        println("Debug signing from " + project.property("chiakiDebugKeystore"))
        signingConfigs.debug.storeFile = file(project.property("chiakiDebugKeystore"))
        signingConfigs.debug.storePassword = "android"
        signingConfigs.debug.keyAlias = "androiddebugkey"
        signingConfigs.debug.keyPassword = "android"
    }
}

// PLE-524: the NDK's wrap.sh (and, for ASan, its runtime library) per packaged ABI. wrap.sh
// only runs for a debuggable app whose native libraries are extracted on install.
if(sanitizerArg) {
    def ndkDir = android.ndkDirectory
    def wrapSh = new File(ndkDir, "wrap.sh/${sanitizerArg == "address" ? "asan" : "hwasan"}.sh")
    def prebuilt = new File(ndkDir, "toolchains/llvm/prebuilt").listFiles().find { it.isDirectory() }
    def clangDir = new File(prebuilt, "lib/clang").listFiles().find { it.isDirectory() }
    def runtimeArch = ["arm64-v8a": "aarch64", "armeabi-v7a": "arm", "x86": "i686", "x86_64": "x86_64"]
    def abis = chiakiAbiFilters ?: runtimeArch.keySet().toList()
    def generated = layout.buildDirectory.dir("generated/chiakiSanitizer").get().asFile
    def sanitizerRuntime = tasks.register("chiakiSanitizerRuntime", Sync) {
        into generated
        abis.each { abi ->
            from(wrapSh) {
                into "resources/lib/$abi"
                rename { "wrap.sh" }
            }
            if(sanitizerArg == "address") {
                from(new File(clangDir, "lib/linux/libclang_rt.asan-${runtimeArch[abi]}-android.so")) {
                    into "jniLibs/$abi"
                }
            }
        }
    }
    android.sourceSets.debug.resources.srcDir(new File(generated, "resources"))
    android.sourceSets.debug.jniLibs.srcDir(new File(generated, "jniLibs"))
    android.packaging.jniLibs.useLegacyPackaging = true
    tasks.named("preBuild") { dependsOn sanitizerRuntime }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.core.ktx
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.preference.ktx
    implementation libs.material
    implementation libs.browser
    // PLE-324: only the PSN mock build's WebAuthn probe uses it; nothing in src/main does.
    debugImplementation libs.webkit

    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx

    implementation libs.coroutines.android
    implementation libs.serialization.json
    implementation libs.okhttp

    implementation libs.room.runtime
    ksp libs.room.compiler
    implementation libs.room.ktx

    implementation libs.moshi
    ksp libs.moshi.kotlin.codegen

    implementation libs.oboe

    testImplementation 'junit:junit:4.13.2'
    testImplementation libs.mockwebserver
    testImplementation libs.coroutines.test
    testImplementation libs.robolectric
}
